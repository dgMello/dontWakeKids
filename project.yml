# Backup only. If DontWakeTheKids.xcodeproj ever refuses to open, regenerate it with:
#   brew install xcodegen && xcodegen generate
name: DontWakeTheKids
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  DontWakeTheKids:
    type: application
    platform: iOS
    sources: [DontWakeTheKids]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dougmello.dontwakethekids
        DEVELOPMENT_TEAM: 3GN7G883K7
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Don't Wake"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.casual-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  DontWakeTheKidsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DontWakeTheKidsTests]
    dependencies:
      - target: DontWakeTheKids
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dougmello.dontwakethekids.tests
        DEVELOPMENT_TEAM: 3GN7G883K7
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DontWakeTheKids:
    build:
      targets:
        DontWakeTheKids: all
    test:
      targets: [DontWakeTheKidsTests]
